<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07021f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Dance Motion</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- React, Three.js and MediaPipe are loaded from CDNs (internet required). Versions are pinned. -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="root">
    <div id="boot">Loading Dance Motion…</div>
  </div>
  <script type="module">
    // Dynamic import so a failed CDN download shows a clear message instead of a blank page.
    import("./dist/main.js").catch((e) => {
      const el = document.getElementById("boot");
      if (!el) return;
      el.className = "boot-fail";
      el.innerHTML =
        "<b>Dance Motion could not start.</b><br>It downloads React, Three.js and MediaPipe from public CDNs " +
        "(esm.sh, cdn.jsdelivr.net) and needs an internet connection.<br>" +
        "Did you run <code>npm run build</code> (or <code>tsc</code>) so that <code>dist/</code> exists?<br><small></small>";
      el.querySelector("small").textContent = String(e && (e.message || e));
      console.error(e);
    });
  </script>
</body>
</html>
